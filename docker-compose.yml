name: hoteltrivago

services:
  mongodb:
    image: mongo:8.0

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Define MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
    
    volumes:
      - mongodb_data:/data/db
    
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:5000"
    
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-hoteltrivago}
      MONGO_USERNAME: ${MONGO_ROOT_USERNAME:?Define MONGO_ROOT_USERNAME en .env}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      MONGO_AUTH_SOURCE: admin
    
    depends_on:
      mongodb:
        condition: service_healthy
    
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
volumes:
  mongodb_data:
