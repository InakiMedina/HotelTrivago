name: CI

on:
  pull_request:
    branches:
      - beta
      - main

  push:
    branches:
      - beta
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BACKEND_PORT: "8000"
      MONGO_ROOT_USERNAME: ci_admin
      MONGO_ROOT_PASSWORD: ci_disposable_password
      MONGO_DB: hoteltrivago_ci

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mostrar versiones de Docker
        run: |
          docker --version
          docker compose version

      - name: Validar configuración de Compose
        run: docker compose config --quiet

      - name: Construir imagen del backend
        run: docker compose build backend

      - name: Iniciar servicios y esperar su estado saludable
        run: |
          docker compose up \
            --detach \
            --wait \
            --wait-timeout 120 \
            mongodb backend

      - name: Comprobar respuesta del backend
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --max-time 10 \
            http://127.0.0.1:8000/health \
            --output health.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("health.json").read_text())

          if response.get("status") != "ok":
              raise SystemExit(
                  f"Respuesta inesperada de /health: {response}"
              )

          print("Health check correcto")
          PY

      - name: Mostrar diagnóstico si falla
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Detener servicios y eliminar datos de CI
        if: always()
        run: docker compose down --volumes --remove-orphans